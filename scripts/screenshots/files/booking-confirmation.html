<!doctype html>
<!--

  hotels and booking sites, it carries its bookings as schema.org markup, which RaceNode reads on the device.

  service, so the screenshot calls no server (the demo stays untouched). Don't move them into the HTML:
  every sentence below is a CSS "content" string (xNN::before), the body only holds empty boxes.
-->
